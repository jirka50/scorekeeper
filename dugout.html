<!doctype html>
<html lang="cs"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dugout · Baseball Scorekeeper</title>
<link rel="icon" href="favicon-32x32.png">
<!-- Stránka pro tablet v dugoutu. Záměrně bez moderního JS i CSS, aby běžela i na Androidu 4.1 (Chrome 71, Firefox 68).
     Bez přihlášení: jen čte public/<tým>/dugout přes REST, data tam posílá aplikace zapisovatele. -->
<style>
body{margin:0;background:#f4f6f2;color:#14202c;font:18px/1.3 Arial,Helvetica,sans-serif}
.top{background:#173a2a;color:#fff;padding:6px 14px 8px;text-align:center}
.top table{width:100%;border:0;background:none;table-layout:fixed}
.top td{border:0;padding:0;color:#fff;font-weight:bold;vertical-align:middle;overflow:hidden;word-wrap:break-word}
.tm{font-size:38px;line-height:1.05}.tm.long{font-size:30px}.tm.l{text-align:right}.tm.r{text-align:left}
.tm small{display:block;font-size:16px;font-weight:normal;color:#b9d4c4}
.top td.sc{font-size:92px;line-height:1;color:#ffd54a;width:260px;white-space:nowrap;text-align:center}
.st{font-size:26px;margin-top:2px}
.dot{display:inline-block;width:24px;height:24px;border-radius:12px;border:3px solid #fff;margin-left:6px;vertical-align:-4px;box-sizing:border-box}
.dot.on{background:#ff6b5a;border-color:#ff6b5a}
.wrap{overflow:hidden;padding:8px 10px}
.col{float:left;width:49%}.col.r{float:right}
h2{margin:0 0 6px;font-size:18px;text-transform:uppercase;color:#4a5a52;letter-spacing:1px}
table.lu{width:100%;border-collapse:collapse;background:#fff;border:1px solid #cdd8cb;table-layout:fixed}
.lu td{padding:4px 8px;border-bottom:1px solid #e3e9e1;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lu td.n{width:24px;color:#6b7a73;text-align:right}
.lu td.s{width:96px;text-align:right;color:#4a5a52}
.lu tr.now td{background:#ffd54a;font-weight:bold}
.lu tr.next td{background:#fff4c4}
.tag{font-size:13px;background:#14202c;color:#fff;border-radius:3px;padding:1px 5px;margin-left:6px;vertical-align:2px}
.field{position:relative;width:400px;height:300px;margin:0 auto;-webkit-transform-origin:0 0;transform-origin:0 0;background:#fff;border:1px solid #cdd8cb}
.field svg{position:absolute;left:0;top:0}
.p{position:absolute;width:120px;margin-left:-60px;text-align:center;font-size:17px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p b{display:block;font-size:14px;color:#fff;background:#2c6a43;border-radius:3px;margin:0 auto 2px;width:38px}
.sum{margin-top:8px;font-size:16px;color:#4a5a52}
.empty{background:#fff;border:1px solid #cdd8cb;padding:16px;color:#4a5a52}
.box{max-width:420px;margin:40px auto;background:#fff;border:1px solid #cdd8cb;padding:20px}
.box h1{margin:0 0 8px;font-size:26px}
.foot{padding:0 10px 10px;font-size:14px;color:#6b7a73;overflow:hidden}
.stale{background:#c0392b;color:#fff;text-align:center;padding:4px;font-size:16px}
@media (max-width:860px){.tm{font-size:28px}.tm.long{font-size:22px}.top td.sc{font-size:70px;width:190px}.st{font-size:21px}.lu td{font-size:17px}.lu td.s{width:84px}.tag{font-size:11px}.field{margin:0 0 -30px;-webkit-transform:scale(.9);transform:scale(.9)}}
@media (max-width:700px){.col,.col.r{float:none;width:auto;margin-bottom:12px}.field{margin:0 auto;-webkit-transform:none;transform:none}.top td.sc{font-size:64px;width:160px}.tm{font-size:24px}.tm.long{font-size:19px}}
</style></head>
<body><div id="app"><div class="box">Načítám…</div></div>
<script>
var DB='https://eagles-scorekeeper-default-rtdb.europe-west1.firebasedatabase.app',POLL=4000;
var TID='',G=null,lastOk=0,lastTs=null,loaded=false,timer=null;
var POSL={'1':'P','2':'C','3':'1B','4':'2B','5':'3B','6':'SS','7':'LF','8':'CF','9':'RF','10':'OF'};
/* pozice v obdélníku 400×300 (střed jmenovky, horní okraj) */
var POSXY={'1':[200,163],'2':[200,260],'3':[340,178],'4':[268,105],'5':[60,178],'6':[132,105],'7':[80,34],'8':[200,6],'9':[320,34]};
var HITS={'1B':1,'2B':1,'3B':1,'HR':1};

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function qs(n){var m=new RegExp('[?&]'+n+'=([^&#]*)').exec(location.search);return m?decodeURIComponent(m[1]):''}

/* ---------- čtení veřejných dat public/<tým>/dugout, bez přihlášení ---------- */
function tick(){clearTimeout(timer);var x=new XMLHttpRequest();
  x.open('GET',DB+'/public/'+encodeURIComponent(TID)+'/dugout.json?t='+Date.now(),true);x.timeout=15000;
  x.onreadystatechange=function(){if(x.readyState!==4)return;
    if(x.status===200){lastOk=Date.now();loaded=true;var v=null;try{v=JSON.parse(x.responseText)}catch(e){}
      if(!v){G=null}else if(v.ts!==lastTs){try{G=JSON.parse(v.json);lastTs=v.ts}catch(e){}}}
    render();timer=setTimeout(tick,POLL)};
  x.send(null)}

/* ---------- pomocné ---------- */
function anon(n){return String(n).charAt(0)==='?'}
function noNum(n){return String(n).charAt(0)==='~'}
function numTxt(n){return anon(n)?'P'+String(n).slice(1):noNum(n)?'—':'#'+n}
function first(n){var x=G.names&&G.names[n],nm=x?String(x).split(' ')[0]:'';return noNum(n)?(nm||'—'):anon(n)?'Hráč '+String(n).slice(1):numTxt(n)+(nm?' '+nm:'')}
function sum(a){var t=0;for(var i=0;i<(a||[]).length;i++)t+=a[i]||0;return t}
function dots(n){var h='';for(var i=0;i<3;i++)h+='<i class="dot'+(i<n?' on':'')+'"></i>';return h}
function stat(n){var pa=0,h=0,r=0;(G.pas||[]).forEach(function(x){if(x[0]===n){pa++;if(HITS[x[1]])h++;if(x[2])r++}});return pa?h+'/'+pa+(r?' · '+r+' R':''):''}
function hm(t){var d=new Date(t);return(d.getHours()<10?'0':'')+d.getHours()+':'+(d.getMinutes()<10?'0':'')+d.getMinutes()}

/* ---------- vykreslení ---------- */
function msg(t){return '<div class="box">'+t+'</div>'}
function view(){
  if(!TID)return msg('V adrese chybí tým. Otevři odkaz zkopírovaný v aplikaci (Živé skóre → Tablet do dugoutu).');
  if(!loaded)return msg(lastOk?'Načítám…':'Připojuji se…');
  if(!G||G.example)return msg('Zápas zatím není rozehraný. Stránka se obnoví sama.')+foot();
  var o=G.ours,batting=(G.top?0:1)===o,fin=!!G.final,us=G.us||'Náš tým',them=G.them||'Soupeř';
  var h='';
  if(Date.now()-lastOk>30000)h+='<div class="stale">Bez spojení od '+hm(lastOk)+'. Údaje nemusí být aktuální.</div>';
  h+='<div class="top"><table><tr><td class="tm l'+(us.length>14?' long':'')+'">'+esc(us)+'<small>náš tým</small></td><td class="sc">'+sum(G.runs&&G.runs[o])+' : '+sum(G.runs&&G.runs[1-o])+'</td><td class="tm r'+(them.length>14?' long':'')+'">'+esc(them)+'<small>soupeř</small></td></tr></table>';
  h+='<div class="st">'+(fin?'Konec zápasu':G.inning+'. směna '+(G.top?'▲':'▼')+' &nbsp;·&nbsp; '+(batting?'pálíme':'bráníme')+' &nbsp;·&nbsp; Auty'+dots(G.outs||0))+'</div></div>';
  /* pálkařské pořadí */
  var L=G.lineup||[],cur=G.bat||0;
  h+='<div class="wrap"><div class="col"><h2>Pálkařské pořadí</h2>';
  if(!L.length)h+='<div class="empty">Sestava není nastavená.</div>';
  else{h+='<table class="lu">';L.forEach(function(n,i){var k=fin?-1:(i-cur+L.length)%L.length,cls=k===0?'now':k===1?'next':'',
      tag=k===0?(batting?'PÁLÍ':'NA ŘADĚ'):k===1?(batting?'NA ŘADĚ':'PŘIPRAV'):'';
    h+='<tr class="'+cls+'"><td class="n">'+(i+1)+'</td><td>'+esc(first(n))+(tag?'<span class="tag">'+tag+'</span>':'')+'</td><td class="s">'+esc(stat(n))+'</td></tr>'});
    h+='</table>'}
  /* obrana: směna, kterou bráníme teď nebo jako další */
  var fi=G.defInn,D=G.def,bench=[],extra=[],at={};
  if(D)for(var n in D){if(D[n]==='10')extra.push(first(n));else if(POSXY[D[n]])at[D[n]]=n;else bench.push(first(n))}
  h+='</div><div class="col r"><h2>Obrana · '+fi+'. směna'+(batting&&!fin?' (další)':'')+'</h2>';
  if(!D)h+='<div class="empty">Obrana pro tuto směnu není nastavená.</div>';
  else{h+='<div class="field"><svg width="400" height="300" viewBox="0 0 400 300"><path d="M200 300 L40 150 A226 226 0 0 1 360 150 Z" fill="#d9ead3"/>'+
      '<polygon points="200,290 290,205 200,120 110,205" fill="#e8cfa4" stroke="#b08a55" stroke-width="2"/>'+
      '<rect x="194" y="284" width="12" height="12" fill="#fff" stroke="#888"/><rect x="284" y="199" width="12" height="12" fill="#fff" stroke="#888"/>'+
      '<rect x="194" y="114" width="12" height="12" fill="#fff" stroke="#888"/><rect x="104" y="199" width="12" height="12" fill="#fff" stroke="#888"/></svg>';
    for(var p in POSXY)if(at[p])h+='<div class="p" style="left:'+POSXY[p][0]+'px;top:'+POSXY[p][1]+'px"><b>'+POSL[p]+'</b>'+esc(first(at[p]))+'</div>';
    h+='</div><div class="sum">'+(extra.length?'Další zadák: '+esc(extra.join(', '))+' · ':'')+'Lavička: '+esc(bench.length?bench.join(', '):'—')+'</div>'}
  h+='</div></div>'+foot();return h}
function foot(){return '<div class="foot">'+(lastOk?'Aktualizováno '+hm(lastOk)+' · obnovuje se samo':'')+'</div>'}
function render(){document.getElementById('app').innerHTML=view()}

TID=qs('tym');render();if(TID)tick();
</script></body></html>
