<!doctype html>
<html lang="cs"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dugout · Baseball Scorekeeper</title>
<link rel="icon" href="favicon-32x32.png">
<!-- Stránka pro tablet v dugoutu. Záměrně bez moderního JS i CSS, aby běžela i na Androidu 4.1 (Chrome 71, Firefox 68).
     Bez přihlášení: jen čte public/<tým>/dugout přes REST, data tam posílá aplikace zapisovatele. -->
<style>
body{margin:0;background:#f4f6f2;color:#14202c;font:bold 18px/1.3 Arial,Helvetica,sans-serif}
button,input{font-weight:bold}
.top{background:#173a2a;color:#fff;padding:4px 14px;text-align:center}
.top table{width:100%;border:0;background:none;table-layout:fixed}
.top td{border:0;padding:0;color:#fff;font-weight:bold;vertical-align:middle;overflow:hidden;word-wrap:break-word}
.top td.tm{white-space:nowrap;text-align:center;padding:0 6px;vertical-align:middle}
.top td.sc.a{position:relative;overflow:visible}.sc.a i{position:absolute;right:-.14em;font-style:normal}
.tm span{display:inline-block;font-size:40px;line-height:.95;white-space:nowrap}
.top td.ls{width:1px;padding-right:12px;vertical-align:middle}
table.lsc{border-collapse:collapse;table-layout:auto;width:auto}
.lsc td,.lsc th{border:1px solid #2f5a44;padding:1px 6px;font-size:17px;color:#fff;text-align:center;min-width:16px}
.lsc th{color:#b9d4c4;font-size:14px;border-top:0}.lsc td.nm{text-align:left;max-width:80px;overflow:hidden;color:#b9d4c4}
.lsc td.cur{background:#ffd54a;color:#14202c}.lsc td.tot{color:#ffd54a;font-size:19px}
.top td.sc{font-size:104px;line-height:.9;color:#ffd54a;padding:0 8px;white-space:nowrap;text-align:center;letter-spacing:-2px}
.top td.st{width:180px;font-size:26px;line-height:1.35;text-align:right;border-left:2px solid #2f5a44;padding-left:10px;white-space:nowrap}
.st span{display:block}.st .big{font-size:30px;color:#ffd54a;text-transform:uppercase}
.dot{display:inline-block;width:24px;height:24px;border-radius:12px;border:3px solid #fff;margin-left:6px;vertical-align:-4px;box-sizing:border-box}
.dot.on{background:#ff6b5a;border-color:#ff6b5a}
.wrap{overflow:hidden;padding:8px 10px}
.col{float:left;width:44%}.col.r{float:right;width:55%}
#luw{overflow-y:auto;-webkit-overflow-scrolling:touch;border:1px solid #cdd8cb;background:#fff}
#luw table.lu{border:0}
h2{margin:0 0 6px;font-size:18px;text-transform:uppercase;color:#4a5a52;letter-spacing:1px}
table.lu{width:100%;border-collapse:collapse;background:#fff;border:1px solid #cdd8cb;table-layout:fixed}
.lu td{padding:0 8px;line-height:1;height:38px;border-bottom:1px solid #e3e9e1;font-size:24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lu td.n{width:1.6em;padding:0 4px 0 6px;text-overflow:clip;overflow:visible;color:#6b7a73;text-align:right}
.lu td.s{width:120px;text-align:right;color:#4a5a52}
.lu tr.now td{background:#2c6a43;color:#fff;font-weight:bold}
.lu tr.now .tag{background:#fff;color:#2c6a43}
.lu tr.next td{background:#ffe88a}
.lu tr.prp td{background:#fff7d6}
.tag{font-size:14px;line-height:1.2;background:#14202c;color:#fff;border-radius:3px;padding:1px 5px;margin-left:6px;vertical-align:2px}
#fw{position:relative;margin:0 auto;overflow:hidden;width:400px;height:300px}
.ftl{position:absolute;left:8px;bottom:5px;line-height:1.25;font-size:14px;font-weight:bold;text-transform:uppercase;letter-spacing:1px;color:#4a5a52;z-index:2}
.fb{position:absolute;top:4px;z-index:3}.fb.l{left:4px}.fb.r{right:4px}.fb button{float:none!important;margin:0!important}
.upd{position:absolute;right:8px;bottom:5px;font-size:12px;color:#6b7a73;z-index:2}
.field{position:relative;width:398px;height:298px;-webkit-transform-origin:0 0;transform-origin:0 0;background:#fff;border:1px solid #cdd8cb}
.field svg{position:absolute;left:0;top:0}
.p{position:absolute;width:120px;margin-left:-60px;text-align:center;font-size:17px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p b{display:block;font-size:14px;color:#fff;background:#2c6a43;border-radius:3px;margin:0 auto 2px;width:38px}
.sum{margin-top:6px;font-size:16px;color:#4a5a52;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{background:#fff;border:1px solid #cdd8cb;padding:16px;color:#4a5a52}
.box{max-width:420px;margin:40px auto;background:#fff;border:1px solid #cdd8cb;padding:20px}
.box h1{margin:0 0 8px;font-size:26px}
.foot{padding:6px 0 0;font-size:16px;line-height:30px;color:#4a5a52;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#fs,#voice{float:right;font-size:15px;padding:5px 10px;margin-left:8px;background:#173a2a;color:#fff;border:0;border-radius:5px}
.stale{background:#c0392b;color:#fff;text-align:center;padding:4px;font-size:16px}
.prep{background:#fff7d6;border:3px solid #c9a227;padding:2px 12px 4px;margin-bottom:8px;font-size:28px;line-height:1.1;font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prep .tv{font-size:40px;line-height:1.05}.prep.late{background:#ffe0dc;border-color:#c0392b;color:#a32a1d}.prep.off{background:#fff;border-color:#cdd8cb;color:#4a5a52}
.prep small{display:block;font-size:13px;font-weight:bold;text-transform:uppercase;letter-spacing:1px;color:#4a5a52}
#voice.on{background:#c97a00}
@media (max-width:860px){.fb button{font-size:13px;padding:4px 7px}.prep{font-size:22px;padding:4px 10px}.prep small{font-size:12px}.top td.sc{font-size:84px}.lsc td,.lsc th{font-size:13px;padding:0 4px}.lsc td.tot{font-size:15px}.top td.st{width:150px;font-size:20px}.st .big{font-size:23px}.lu td.s{width:76px;font-size:15px!important}.tag{font-size:11px;padding:1px 3px;margin-left:4px}.sum{font-size:14px}}
@media (max-width:700px){.col,.col.r{float:none;width:auto;margin-bottom:12px}.top td.sc{font-size:64px}.top td.st{width:120px;font-size:17px}.st .big{font-size:19px}.lu td{font-size:20px}}
</style>
<style id="dyn"></style></head>
<body><div id="app"><div class="box">Načítám…</div></div>
<script>
var DB='https://eagles-scorekeeper-default-rtdb.europe-west1.firebasedatabase.app',POLL=2000,POLL_SLOW=30000,STREAM=false,ES=null;
var TID='',G=null,lastOk=0,lastTs=null,loaded=false,timer=null;
var POSL={'1':'P','2':'C','3':'1B','4':'2B','5':'3B','6':'SS','7':'LF','8':'CF','9':'RF','10':'OF'};
/* pozice v obdélníku 400×300 (střed jmenovky, horní okraj) */
var POSXY={'1':[200,163],'2':[200,260],'3':[340,178],'4':[268,105],'5':[60,178],'6':[132,105],'7':[80,34],'8':[200,6],'9':[320,34]};
var HITS={'1B':1,'2B':1,'3B':1,'HR':1};

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function qs(n){var m=new RegExp('[?&]'+n+'=([^&#]*)').exec(location.search);return m?decodeURIComponent(m[1]):''}

/* ---------- čtení veřejných dat public/<tým>/dugout, bez přihlášení ---------- */
function url(){return DB+'/public/'+encodeURIComponent(TID)+'/dugout.json'}
function apply(v){lastOk=Date.now();if(v&&v.ts){var d=Date.now()-v.ts;if(Math.abs(d)<43200000&&(SKEW===null||d<SKEW))SKEW=d}loaded=true;if(!v||!v.json){G=null;lastTs=null}else if(lastTs==null||v.ts>lastTs){try{G=JSON.parse(v.json);lastTs=v.ts}catch(e){}}render()}
/* záložní/kontrolní čtení: bez živého spojení každé 2 s, se živým spojením jednou za 30 s */
function tick(){clearTimeout(timer);var x=new XMLHttpRequest();
  x.open('GET',url()+'?t='+Date.now(),true);x.timeout=15000;
  x.onreadystatechange=function(){if(x.readyState!==4)return;
    if(x.status===200){var v=null;try{v=JSON.parse(x.responseText)}catch(e){}apply(v)}else render();
    timer=setTimeout(tick,STREAM?POLL_SLOW:POLL)};
  x.send(null)}
/* živé spojení: databáze sama pošle změnu hned, jak ji zapisovatel uloží */
function stream(){if(!window.EventSource)return;try{ES=new EventSource(url())}catch(e){ES=null;return}
  var on=function(ev){var m=null;try{m=JSON.parse(ev.data)}catch(e){}
    if(m&&m.path==='/')apply(m.data);else tick()};
  ES.addEventListener('put',on,false);ES.addEventListener('patch',function(){tick()},false);
  ES.addEventListener('keep-alive',function(){lastOk=Date.now();render()},false);
  ES.onopen=function(){STREAM=true};
  ES.onerror=function(){if(ES.readyState===2){STREAM=false;ES=null;tick();setTimeout(stream,15000)}}}

/* ---------- pomocné ---------- */
function anon(n){return String(n).charAt(0)==='?'}
function noNum(n){return String(n).charAt(0)==='~'}
function numTxt(n){return anon(n)?'P'+String(n).slice(1):noNum(n)?'—':'#'+n}
function first(n){var x=G.names&&G.names[n],nm=x?String(x).split(' ')[0]:'';return noNum(n)?(nm||'—'):anon(n)?'Hráč '+String(n).slice(1):numTxt(n)+(nm?' '+nm:'')}
function sum(a){var t=0;for(var i=0;i<(a||[]).length;i++)t+=a[i]||0;return t}
function dots(n){var h='';for(var i=0;i<3;i++)h+='<i class="dot'+(i<n?' on':'')+'"></i>';return h}
function stat(n){var pa=0,h=0,r=0;(G.pas||[]).forEach(function(x){if(x[0]===n){pa++;if(HITS[x[1]])h++;if(x[2])r++}});return pa?h+'/'+pa+(r?' · '+r+' R':''):''}
function short(n){n=String(n||'').split(' ')[0];return n.length>8?n.slice(0,7)+'.':n}
function lsW(){var n=Math.max(G.innings||0,G.inning||1,1),c=window.innerWidth<=860?22:28;return 76+(n+1)*c+14}
function lineScore(){var o=G.ours,n=Math.max(G.innings||0,G.inning||1,1),R=G.runs||[[],[]],h='<table class="lsc"><tr><th></th>',i,t;
  for(i=1;i<=n;i++)h+='<th>'+i+'</th>';h+='<th>R</th></tr>';
  for(var k=0;k<2;k++){t=k===0?o:1-o;h+='<tr><td class="nm">'+esc(short(k===0?G.us:G.them))+'</td>';
    for(i=1;i<=n;i++){var played=i<G.inning||(i===G.inning&&(t===0||!G.top))||G.final,cur=!G.final&&i===G.inning&&(G.top?0:1)===t;
      h+='<td'+(cur?' class="cur"':'')+'>'+(played||cur?((R[t]||[])[i-1]||0):'')+'</td>'}
    h+='<td class="tot">'+sum(R[t])+'</td></tr>'}
  return h+'</table>'}
/* čas zápasu: odhad rozdílu hodin tabletu a telefonu zapisovatele (nejmenší pozorovaný rozdíl) */
var SKEW=null;
function mmss(ms){var s=Math.max(0,Math.floor(ms/1000));return Math.floor(s/60)+':'+(s%60<10?'0':'')+s%60}
function timerInfo(){var c=G&&G.clock,L=(G&&G.tl||0)*60000;if(!c)return{cls:'off',lb:L?'Časový limit '+G.tl+' min':'Čas zápasu',tv:'neběží'};
  var now=(c.e||(Date.now()-(SKEW||0))),el=now-c.s;
  if(G.final||c.e)return{cls:'off',lb:'Zápas skončil',tv:'hrálo se '+mmss(el)};
  if(!L)return{cls:'',lb:'Hraje se',tv:mmss(el)};
  if(el<L)return{cls:'',lb:'Do konce zápasu zbývá',tv:mmss(L-el)};
  return{cls:'late',lb:'Čas vypršel, přetahuje se',tv:'+'+mmss(el-L)}}
function timerBox(){var t=timerInfo();return '<div class="prep '+t.cls+'" id="tmr"><small>'+t.lb+'</small><span class="tv">'+t.tv+'</span></div>'}
function timerTick(){var e=document.getElementById('tmr');if(!e||!G)return;var t=timerInfo();e.className='prep '+t.cls;e.innerHTML='<small>'+t.lb+'</small><span class="tv">'+t.tv+'</span>'}
setInterval(timerTick,1000);
function hm(t){var d=new Date(t);return(d.getHours()<10?'0':'')+d.getHours()+':'+(d.getMinutes()<10?'0':'')+d.getMinutes()}

/* ---------- vykreslení ---------- */
function msg(t){return '<div class="box">'+t+'</div>'}
function view(){
  if(!TID)return msg('V adrese chybí tým. Otevři odkaz zkopírovaný v aplikaci (Živé skóre → Tablet do dugoutu).');
  if(!loaded)return msg(lastOk?'Načítám…':'Připojuji se…');
  if(!G||G.example)return msg('Zápas zatím není rozehraný. Stránka se obnoví sama.')+foot();
  var o=G.ours,batting=(G.top?0:1)===o,fin=!!G.final,us=G.us||'Náš tým',them=G.them||'Soupeř';
  var h='';
  if(Date.now()-lastOk>(STREAM?75000:30000))h+='<div class="stale">Bez spojení od '+hm(lastOk)+'. Údaje nemusí být aktuální.</div>';
  h+='<div class="top"><table><tr><td class="ls" rowspan="2" style="width:'+lsW()+'px">'+lineScore()+'</td><td class="tm"><span>'+esc(us)+'</span></td><td class="tm"><span>'+esc(them)+'</span></td><td class="st" rowspan="2">'+(fin?'<span class="big">Konec</span><span>zápasu</span>':'<span>'+G.inning+'. směna '+(G.top?'▲':'▼')+'</span><span class="big">'+(batting?'pálíme':'bráníme')+'</span><span>Auty'+dots(G.outs||0)+'</span>')+'</td></tr><tr><td class="sc a">'+sum(G.runs&&G.runs[o])+'<i>:</i></td><td class="sc b">'+sum(G.runs&&G.runs[1-o])+'</td></tr></table></div>';
  /* pálkařské pořadí */
  var L=G.lineup||[],cur=G.bat||0;
  h+='<div class="wrap"><div class="col">'+timerBox();
  if(!L.length)h+='<div class="empty">Sestava není nastavená.</div>';
  else{h+='<div id="luw"><table class="lu">';L.forEach(function(n,i){var k=fin?-1:(i-cur+L.length)%L.length,pk=batting?2:1,cls=k===0?'now':k===pk?'prp':k===1?'next':'',
      tag=k===0?(batting?'PÁLÍ':'NA ŘADĚ'):k===1&&batting?'NA ŘADĚ':k===pk?'PŘIPRAV SE':'';
    h+='<tr class="'+cls+'"><td class="n">'+(i+1)+'</td><td>'+esc(first(n))+(tag?'<span class="tag">'+tag+'</span>':'')+'</td><td class="s">'+esc(stat(n))+'</td></tr>'});
    h+='</table></div>'}
  /* obrana: směna, kterou bráníme teď nebo jako další */
  var fi=G.defInn,D=G.def,bench=[],extra=[],at={};
  if(D)for(var n in D){if(D[n]==='10')extra.push(first(n));else if(POSXY[D[n]])at[D[n]]=n;else bench.push(first(n))}
  var ttl='Obrana · '+fi+'. směna'+(batting&&!fin?' (další)':'');
  h+='</div><div class="col r">';
  if(!D)h+='<h2>'+ttl+'</h2><div class="empty">Obrana pro tuto směnu není nastavená.</div>'+foot('');
  else{h+='<div id="fw"><div class="ftl">Obrana<br>'+fi+'. směna'+(batting&&!fin?' (další)':'')+'</div><div class="fb l">'+btnFs()+'</div><div class="fb r">'+btnVoice()+'</div>'+(lastOk?'<div class="upd">Aktualizováno '+hm(lastOk)+'</div>':'')+'<div class="field" id="fld"><svg width="400" height="300" viewBox="0 0 400 300"><path d="M200 300 L40 150 A226 226 0 0 1 360 150 Z" fill="#d9ead3"/>'+
      '<polygon points="200,290 290,205 200,120 110,205" fill="#e8cfa4" stroke="#b08a55" stroke-width="2"/>'+
      '<rect x="194" y="284" width="12" height="12" fill="#fff" stroke="#888"/><rect x="284" y="199" width="12" height="12" fill="#fff" stroke="#888"/>'+
      '<rect x="194" y="114" width="12" height="12" fill="#fff" stroke="#888"/><rect x="104" y="199" width="12" height="12" fill="#fff" stroke="#888"/></svg>';
    for(var p in POSXY)if(at[p])h+='<div class="p" style="left:'+POSXY[p][0]+'px;top:'+POSXY[p][1]+'px"><b>'+POSL[p]+'</b>'+esc(first(at[p]))+'</div>';
    h+='</div></div>'+foot((extra.length?'Další zadák: '+esc(extra.join(', '))+' · ':'')+'Lavička: '+esc(bench.length?bench.join(', '):'—'),true)}
  h+='</div></div>';return h}
function btnVoice(){return voiceCan()?'<button id="voice" type="button" class="'+(VOICE?'on':'')+'">'+(VOICE?'Hlášení: zap':'Hlásit nahlas')+'</button>':''}
function btnFs(){return fsCan()&&!fsEl()?'<button id="fs" type="button">Celá obrazovka</button>':''}
function foot(txt,nob){return '<div class="foot" id="sum">'+(nob?'':btnVoice()+btnFs())+(txt!=null?txt:lastOk?'Aktualizováno '+hm(lastOk):'')+'</div>'}
var lastCur=null;
/* kdo se má připravit: hráč za tím, kdo je na řadě (pálíme: pálkař+2, bráníme: první na řadě+1) */
function prepNum(){if(!G||G.final||G.example)return null;var L=G.lineup||[];if(!L.length)return null;var batting=(G.top?0:1)===G.ours;
  return L[((G.bat||0)+(batting?2:1))%L.length]}
/* hlášení nahlas (čeština, pokud ji tablet umí) */
var VOICE=false,lastSaid=null;try{VOICE=localStorage.getItem('sk-dug-voice')==='1'}catch(e){}
function voiceCan(){return !!(window.speechSynthesis&&window.SpeechSynthesisUtterance)}
function say(t){if(!voiceCan())return;try{var u=new SpeechSynthesisUtterance(t);u.lang='cs-CZ';u.rate=0.9;var vs=speechSynthesis.getVoices()||[];
  for(var i=0;i<vs.length;i++)if(/^cs/i.test(vs[i].lang)){u.voice=vs[i];break}speechSynthesis.speak(u)}catch(e){}}
function spoken(n){var x=G.names&&G.names[n],nm=x?String(x).split(' ')[0]:'';return (nm||'hráč')+(!anon(n)&&!noNum(n)?', číslo '+n:'')}
function sayText(n){return 'Připraví se '+spoken(n)}
/* hlášení: změna poloviny (jdeme pálit / do pole), pak kdo se připraví */
var lastBat=null;
function announce(){if(!G||G.final||G.example)return;var L=G.lineup||[],bat=(G.top?0:1)===G.ours,key=G.inning+(G.top?'t':'b');
  if(lastBat!==null&&key!==lastBat.k&&bat!==lastBat.b&&VOICE){
    if(bat&&L.length)say('Jdeme pálit. Pálí '+spoken(L[(G.bat||0)%L.length]));else if(!bat)say('Jdeme do pole')}
  lastBat={k:key,b:bat};
  var n=prepNum();if(n==null||n===lastSaid)return;var isFirst=lastSaid===null;lastSaid=n;if(VOICE&&!isFirst)say(sayText(n))}
function voiceToggle(){VOICE=!VOICE;try{localStorage.setItem('sk-dug-voice',VOICE?'1':'0')}catch(e){}var n=prepNum();if(VOICE&&n!=null)say(sayText(n));render()}
function render(){var w=document.getElementById('luw'),st=w?w.scrollTop:0;document.getElementById('app').innerHTML=view();fit();announce();
  w=document.getElementById('luw');if(!w)return;w.scrollTop=st;
  var cur=G&&!G.final?G.bat:null;if(cur!==lastCur){lastCur=cur;var r=w.getElementsByTagName('tr')[cur||0];
    if(r&&(r.offsetTop<w.scrollTop||r.offsetTop+r.offsetHeight>w.scrollTop+w.clientHeight))w.scrollTop=Math.max(0,r.offsetTop-r.offsetHeight)}}
/* pořadí: velikost řádků tak, aby se vešlo 11 pálkařů, zbytek se posouvá */
function fitField(){var fw=document.getElementById('fw'),f=document.getElementById('fld');if(!fw)return;
  var cw=fw.parentNode.clientWidth,top=fw.getBoundingClientRect().top+(window.pageYOffset||0),sm=document.getElementById('sum'),
    below=(sm?sm.offsetHeight:0)+12,sc=cw/400;
  if(window.innerWidth>700)sc=Math.min(sc,(window.innerHeight-top-below)/300);else sc=Math.min(sc,1.6);
  sc=Math.max(0.7,Math.floor(sc*100)/100);var lf=Math.max(17,Math.round(15/sc)),ps=f.getElementsByTagName('div');for(var i=0;i<ps.length;i++)ps[i].style.fontSize=lf+'px';fw.style.width=Math.floor(400*sc)+'px';fw.style.height=Math.floor(300*sc)+'px';
  f.style.webkitTransform=f.style.transform='scale('+sc+')'}
function fitNames(){var ss=document.querySelectorAll('.tm span');for(var i=0;i<ss.length;i++){var sp=ss[i],w=sp.parentNode.clientWidth-12,f=window.innerWidth<=700?20:window.innerWidth<=860?30:40;
  sp.style.whiteSpace='nowrap';sp.style.fontSize=f+'px';while(f>17&&sp.offsetWidth>w){f-=2;sp.style.fontSize=f+'px'}
  if(sp.offsetWidth>w){sp.style.whiteSpace='normal';sp.style.width=w+'px';f=Math.min(f,24);sp.style.fontSize=f+'px';while(f>12&&sp.offsetHeight>f*2.05){f-=2;sp.style.fontSize=f+'px'}}else sp.style.width=''}}
function fit(){fitNames();fitField();var d=document.getElementById('dyn'),w=document.getElementById('luw');
  if(!w||window.innerWidth<=700){d.textContent='';if(w)w.style.height='';return}
  var av=window.innerHeight-w.getBoundingClientRect().top-(window.pageYOffset||0)-10,rh=Math.max(30,Math.floor(av/11)),fz=Math.min(38,Math.max(17,Math.round(rh*0.8)));
